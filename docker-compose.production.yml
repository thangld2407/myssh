services:
  myssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/myssh/myssh:latest
    container_name: myssh-app
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_PATH=/app/data/myssh.db
      - RECORDINGS_DIR=/app/data/recordings
      - MASTER_KEY=${MASTER_KEY:-change-me-to-a-secure-32-byte-key!}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-secure-random-secret!}
    volumes:
      - myssh-data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: myssh-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    command: caddy reverse-proxy --from https://${DOMAIN:-localhost} --to myssh:8080
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - myssh

volumes:
  myssh-data:
  caddy-data:
  caddy-config:
